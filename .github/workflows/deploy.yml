name: Deploy to AWS

# Continuous delivery: every push to main that passes CI is packaged, deployed to the
# Lambda stack, then smoke-tested against the live URL. Manual runs are allowed too.
on:
  workflow_run:
    workflows: ["Continuous Testing"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write    # OIDC token to assume the AWS role; no static keys in GitHub
  contents: read

concurrency: deploy-${{ github.ref }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: aws-demo
    outputs:
      base_url: ${{ steps.deploy.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Deploy stack
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
          SUBMISSION_API_KEY: ${{ secrets.SUBMISSION_API_KEY }}
        run: |
          infra/deploy.sh submission-service | tee deploy.log
          echo "base_url=$(grep -o 'export BASE_URL=.*' deploy.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  post-deploy-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Smoke + regression against live stack
        env:
          BASE_URL: ${{ needs.deploy.outputs.base_url }}
          SUBMISSION_API_KEY: ${{ secrets.SUBMISSION_API_KEY }}
        run: pytest -m "smoke or api or security" --junitxml=reports/live.xml --html=reports/live.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-report
          path: reports/

  post-deploy-java-aws:
    # Runs after the Python job, not beside it: both use the one live table, and the Python
    # suite clears it between tests, which made a Java read fail when they overlapped.
    needs: [deploy, post-deploy-tests]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: aws-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Java API + AWS resource tests against the live stack
        run: mvn -B clean test -Paws -Daws.region="${AWS_REGION}" -Dapi.key="${SUBMISSION_API_KEY}"
        working-directory: java-api-tests
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
          SUBMISSION_API_KEY: ${{ secrets.SUBMISSION_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-aws-surefire-reports
          path: java-api-tests/target/surefire-reports/
