name: Continuous Testing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nightly full run incl. scale tests

jobs:
  python-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: smoke, marker: "smoke" }
          - { name: api, marker: "api or security or aws" }
          - { name: ui, marker: "ui or a11y or mobile" }
          - { name: integration, marker: "integration or scale" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run ${{ matrix.suite.name }} suite
        run: pytest -m "${{ matrix.suite.marker }}" --junitxml=reports/${{ matrix.suite.name }}.xml --html=reports/${{ matrix.suite.name }}.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.suite.name }}
          path: reports/

  java-api-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: pip install flask
      - name: Start system under test
        run: |
          python -m app.server &
          for _ in $(seq 1 20); do curl -sf localhost:5001/health && break; sleep 1; done
      - run: mvn -B clean test -Dbase.url=http://localhost:5001
        working-directory: java-api-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: java-api-tests/target/surefire-reports/

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Publish failing tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = "reports/docker.xml"
          if not os.path.exists(path):
              print("::error::No test report was produced. The image build or app start-up failed before pytest ran.")
              raise SystemExit
          for tc in ET.parse(path).getroot().iter("testcase"):
              for kind in ("failure", "error"):
                  node = tc.find(kind)
                  if node is not None:
                      msg = (node.get("message") or "").replace("\n", " ")[:300]
                      print(f"::error::{tc.get('classname')}::{tc.get('name')} {kind}: {msg}")
          PY

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # full history, so the secret scan covers every commit
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit bandit cfn-lint
      - name: Dependencies with known vulnerabilities (SCA, pip-audit)
        run: pip-audit -r requirements.txt
      - name: Static analysis of application code (SAST, bandit; fails on medium and above)
        run: bandit -c security/bandit.yaml -r app aws -ll
      - name: Infrastructure template lint (IaC, cfn-lint)
        run: cfn-lint infra/template.yaml infra/github-oidc-role.yaml infra/pipeline.yaml infra/test-plan.yaml
      - name: Secrets in any commit (gitleaks)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
      - name: Workflow lint (actionlint)
        uses: raven-actions/actionlint@v2

  dynamic-scan:
    # DAST: OWASP ZAP crawls the running app and passively inspects every response.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install flask
      - name: Start the app with sample data
        run: |
          python -m app.server > sut.log 2>&1 &
          for _ in $(seq 1 20); do curl -sf localhost:5001/health && break; sleep 1; done
          curl -sf -o /dev/null -X POST localhost:5001/submit -H "Sec-Fetch-Site: same-origin" \
            --data-urlencode "title=ZAP seed" --data-urlencode "author=scanner" \
            --data-urlencode "text=A seeded submission so the results table has a row to inspect."
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5001"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report

  unit-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Whole-suite coverage
        run: pytest -m "not scale" --cov=app --cov=aws --cov-report=term --cov-report=xml:reports/coverage.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: reports/coverage.xml }

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Accessibility audit (WCAG 2.2 A and AA, keyboard, reflow)
        run: python -m tools.a11y_report
      - name: Add results to the run summary
        if: always()
        run: |
          if [ -f reports/accessibility.md ]; then cat reports/accessibility.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: |
            reports/accessibility.html
            reports/accessibility.json
            reports/accessibility.md

  performance:
    runs-on: ubuntu-latest
    env:
      JMETER_VERSION: "5.6.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v4
        with:
          path: ~/jmeter
          key: jmeter-${{ env.JMETER_VERSION }}
      - name: Install JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" | tar -xz -C "$HOME"
          mv "$HOME/apache-jmeter-${JMETER_VERSION}" "$HOME/jmeter"
      - run: pip install flask
      - name: Load test with thresholds
        run: |
          export PATH="$HOME/jmeter/bin:$PATH"
          performance/run.sh
      - name: Add results to the run summary
        if: always()
        run: |
          if [ -f reports/perf.md ]; then cat reports/perf.md >> "$GITHUB_STEP_SUMMARY"; else echo "JMeter produced no results." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: |
            reports/perf-html/
            reports/perf.xml
            reports/perf.md
            reports/perf.jtl

  predictive-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python ai_testing/predict_flaky.py ai_testing/test_history.csv --out reports/flakiness.md
      - run: cat reports/flakiness.md >> "$GITHUB_STEP_SUMMARY"
