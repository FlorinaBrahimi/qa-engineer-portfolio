[pytest]
testpaths = tests ai_testing
addopts = -ra --strict-markers --ignore=ai_testing/generated
markers =
    smoke: fast checks run on every commit
    regression: full behavioural suite run before release
    integration: multi-component flows (API + UI + storage)
    api: HTTP API tests
    ui: browser tests driven by Playwright
    scale: concurrency and throughput checks
    security: auth, header and injection checks
    a11y: accessibility checks
    aws: tests that exercise AWS integrations via moto
    mobile: mobile viewport / Appium tests
